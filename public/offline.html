<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexao</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1e2a38;
      color: #eaf2f8;
      font-family: Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      max-width: 440px;
      background: #2d3945;
      border: 1px solid #3f5366;
      border-radius: 12px;
      padding: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0; opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Voce esta offline</h1>
    <p>Conecte-se a internet e tente novamente.</p>
  </div>
</body>
</html>
